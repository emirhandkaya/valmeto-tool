<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tedarik ve Müşteri Haritası</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="manifest" href="manifest.webmanifest?v=2">
<meta name="theme-color" content="#14171c">
<link rel="icon" href="favicon-32-v2.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Valmeto">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css?v=17">
</head>
<body>
<header class="top"><div class="inner">
  <h1>Valmeto Tool · Harita</h1>
  <nav id="nav"></nav>
</div></header>
<main>
  <div class="legend">
    <span><span class="dot" style="background:#6b7a8f"></span>Alüminyum</span>
    <span><span class="dot" style="background:#c8642f"></span>Bakır</span>
    <span><span class="dot" style="background:#7b4fa0"></span>Bakır + Alüminyum</span>
    <span><span class="dot" style="background:#2e7d4f"></span>Ziyaret edildi / teklif alındı</span>
    <span><span class="dot" style="background:#0f5c8c;border-radius:2px"></span>Potansiyel müşteri</span>
    <span><span class="dot" style="background:#d4a017;border-radius:2px"></span>Mevcut müşteri</span>
    <span>
      <button data-view="cairo">Kahire</button>
      <button data-view="customers">Balkanlar &amp; Türkiye</button>
      <button data-view="all">Tümü</button>
    </span>
    <label><input type="checkbox" id="me"> Konumumu göster</label>
  </div>
  <div id="map"></div>
  <p class="meta">Noktalar yaklaşıktır (sanayi bölgesi / cadde düzeyinde). Yol tarifi için noktaya tıklayıp “Google Maps” açın; taksiciye adresi gösterin.</p>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js?v=17"></script>
<script src="musteriler.js?v=17"></script>
<script src="common.js?v=17"></script>
<script>
const notes = loadNotes();
const map = L.map("map").setView([30.06, 31.35], 10);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap"
}).addTo(map);

function color(f) {
  const st = notes[f.id]?.status;
  if (st === "gidildi" || st === "teklif") return "#2e7d4f";
  if (f.metal.length > 1) return "#7b4fa0";
  return f.metal[0] === "bakir" ? "#c8642f" : "#6b7a8f";
}
const markers = {}, bounds = [];
FACTORIES.filter(f => f.lat != null).forEach(f => {
  const n = notes[f.id] || {};
  const mk = L.circleMarker([f.lat, f.lng], { radius: 10, color: "#fff", weight: 2, fillColor: color(f), fillOpacity: .95 }).addTo(map);
  mk.bindTooltip(`${f.tier} · ` + f.name.split("(")[0].trim());
  mk.bindPopup(`<h3>${esc(f.name)}</h3>
    <b>${f.metal.map(m => METAL_LABEL[m]).join(" + ")}</b> · ${esc(f.area)}<br>
    <small>${esc(f.address)}</small><br>
    ${f.phones.map(p => `📞 <a href="${telHref(p)}">${esc(p)}</a>`).join("<br>")}
    ${f.emails.length ? "<br>" + f.emails.map(e => `✉️ <a href="mailto:${esc(e)}">${esc(e)}</a>`).join("<br>") : ""}
    <br><b>Ürünler:</b> ${esc(f.products.join(", "))}
    ${n.status ? `<br><b>Durum:</b> ${esc(STATUS_LABEL[n.status])}` : ""}
    ${n.price ? `<br><b>Fiyat:</b> ${esc(n.price)} USD/ton` : ""}
    <br><i>Haritadaki nokta yaklaşık; Google Maps bağlantısı firmayı adıyla arar.</i>
    <br>🗓️ ${DAYS[f.day]} · <a href="ziyaret.html#${f.id}">📝 Ziyaret formu</a>
    <br><a href="${mapsHref(f)}" target="_blank" rel="noopener">🧭 Google Maps'te aç</a>`);
  markers[f.id] = mk; if (f.day > 0) bounds.push([f.lat, f.lng]);
});
// Müşteri katmanı (kare işaretler)
let crm = {}; try { crm = JSON.parse(localStorage.getItem("musteri-takip-v1")) || {}; } catch (e) {}
const cBounds = [];
CUSTOMERS.filter(c => c.lat != null).forEach(c => {
  const st = crm[c.id]?.status || (c.current ? "musteri" : "");
  const icon = L.divIcon({ className: "", iconSize: [16, 16], html: `<div style="width:14px;height:14px;border:2px solid #fff;box-shadow:0 0 0 1px #0004;border-radius:3px;background:${st === "musteri" ? "#d4a017" : "#0f5c8c"}"></div>` });
  const mk = L.marker([c.lat, c.lng], { icon }).addTo(map);
  mk.bindTooltip(c.name);
  mk.bindPopup(`<h3>${esc(c.name)}</h3><b>${esc(c.city)}, ${esc(c.country)}</b><br>${esc(c.type)}<br>
    ${c.phones.map(p => `📞 <a href="${telHref(p)}">${esc(p)}</a>`).join("<br>")}
    ${c.emails.length ? "<br>" + c.emails.map(e => `✉️ <a href="mailto:${esc(e)}">${esc(e)}</a>`).join("<br>") : ""}
    <br><b>Alabileceği:</b> ${esc(c.buys)}<br><a href="musteriler.html">→ Müşteri listesi</a>`);
  markers["m-" + c.id] = mk; cBounds.push([c.lat, c.lng]);
});
const views = { cairo: bounds, customers: cBounds, all: bounds.concat(cBounds) };
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => map.fitBounds(views[b.dataset.view], { padding: [30, 30] }));
map.fitBounds(bounds, { padding: [30, 30] });

const hash = location.hash.slice(1);
if (markers[hash]) { map.setView(markers[hash].getLatLng(), 14); markers[hash].openPopup(); }

let meLayer;
document.getElementById("me").onchange = e => {
  if (!e.target.checked) { meLayer && map.removeLayer(meLayer); return; }
  navigator.geolocation?.getCurrentPosition(p => {
    meLayer = L.circleMarker([p.coords.latitude, p.coords.longitude], { radius: 8, color: "#fff", weight: 3, fillColor: "#1a73e8", fillOpacity: 1 })
      .addTo(map).bindTooltip("Buradasınız", { permanent: true });
    map.setView(meLayer.getLatLng(), 12);
  }, () => alert("Konum alınamadı."));
};
</script>
</body>
</html>
