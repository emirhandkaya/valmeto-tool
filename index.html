<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valmeto Tool</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<meta name="theme-color" content="#14171c">
<link rel="icon" href="favicon-32-v2.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Valmeto">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css?v=46">
</head>
<body>
<header class="top"><div class="inner">
  <h1>Valmeto Tool · Mısır Üreticileri</h1>
  <nav id="nav"></nav>
</div></header>

<main>
  <details class="section wa-top" open>
    <summary><b>💬 WhatsApp konuşması</b> <span class="meta">– 1. mesaj karttaki düğmeyle hazır gider, 2. ve 3.'yü buradan kopyala</span></summary>
    <div id="pwMsgs"></div>
  </details>

  <div class="filters">
    <input id="q" type="search" placeholder="Ara: firma, bölge, ürün…">
    <select id="metal">
      <option value="">Tüm metaller</option>
      <option value="bakir">Bakır</option>
      <option value="aluminyum">Alüminyum</option>
    </select>
    <label class="chk"><input type="checkbox" id="onlyGo"> 🚩 Sadece gidilecekler</label>
    <button id="csv">CSV</button>
  </div>
  <p class="meta" id="count"></p>
  <div id="list"></div>
</main>
<footer>Ürün ve iletişim bilgileri firmaların kendi sitelerinden (Kasım 2026). Haritadaki konumlar yaklaşıktır; “Yol tarifi” firmayı adıyla arar.</footer>

<script src="data.js?v=46"></script>
<script src="common.js?v=46"></script>
<script>
const visits = lsGet("valmeto-visits", {});
const R = refs();
function offerUsdT(f) { const v = visits[f.id]; return v && v.priceUsdT ? v.priceUsdT : null; }
function priceTag(f) {
  const p = offerUsdT(f); if (!p) return "";
  const ref = f.metal[0] === "aluminyum" ? R.al : R.cu;
  return `<span class="tag ${p > ref * 1.03 ? "unv" : "ok"}">💰 LME %${(p / ref * 100).toFixed(0)}</span>`;
}
const isWa = p => isMobile(p) || /WhatsApp/i.test(p);
const shortPhone = p => p.replace(/\s*\(.*\)\s*/, "");

function card(f) {
  const ck = esc(contactKey(f));
  const wa = f.phones.find(isWa), tel = f.phones[0];
  const tags = f.metal.map(m => `<span class="tag ${m}">${METAL_LABEL[m]}</span>`).join("")
    + (f.tier === "C" ? `<span class="tag tierC">Büyük / pahalı</span>` : "")
    + (!f.official ? `<span class="tag unv">Sitesi yok</span>` : "") + priceTag(f);
  const mainBtns = [
    tel ? `<a class="btn" data-call="${ck}" href="${telHref(tel)}">📞 Ara</a>` : "",
    wa ? `<a class="btn wa" data-wa="${ck}" href="${waHref(wa, producerWaMessages(f)[0].text)}" target="_blank" rel="noopener">💬 WhatsApp</a>` : "",
    f.emails[0] ? `<a class="btn" data-send="${esc(f.emails[0])}" href="${outlookAppHref(f)}">📧 E-posta</a>` : "",
    `<a class="btn" href="${mapsHref(f)}" target="_blank" rel="noopener">🧭 Yol tarifi</a>`,
    `<a class="btn primary-link" href="ziyaret.html#${f.id}">📝 Form</a>`
  ].join("");
  return `<article class="card pcard" data-id="${f.id}">
    <div class="pc-head"><h2>${f.star ? "★ " : ""}${esc(f.name)}</h2><div class="tags">${tags}</div></div>
    <div class="meta">📍 ${esc(f.area)}</div>
    <div class="pc-plan">${goToggle(f)}${planDateInput(f)}</div>
    <div class="pc-btns">${mainBtns}</div>
    ${mailTracker(f)}
    <details class="pc-more"><summary>Bilgiler: ürünler, tüm numaralar, adres</summary>
      <p class="pc-ours ${f.ours}"><b>${OURS_LABEL[f.ours] || ""}</b>${f.oursNote ? " – " + esc(f.oursNote) : ""}</p>
      <b class="mini-h">Ürünler</b><ul class="products">${f.products.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
      <b class="mini-h">İletişim</b>
      <ul class="plain">${f.phones.map(p => `<li>📞 <a data-call="${ck}" href="${telHref(p)}">${esc(shortPhone(p))}</a> <span class="meta">${esc((p.match(/\((.*)\)/) || [, ""])[1])}</span>${isWa(p) ? ` · <a data-wa="${ck}" href="${waHref(p, producerWaMessages(f)[0].text)}" target="_blank" rel="noopener">WhatsApp</a>` : ""}</li>`).join("")}
        ${f.emails.map(e => `<li>✉️ ${esc(e)} · <a data-send="${esc(e)}" href="${outlookAppHref(f)}">Outlook</a> · <a data-send="${esc(e)}" href="${outlookWebHref(f)}" target="_blank" rel="noopener">Outlook Web</a></li>`).join("")}
        ${f.contact ? `<li>👤 ${esc(f.contact)}</li>` : ""}</ul>
      <b class="mini-h">Adres</b><p>${esc(f.address)}</p>
      ${f.verifyNote ? `<p class="meta">🔎 ${esc(f.verifyNote)}</p>` : ""}
      <p class="pc-links">${f.website ? `<a href="${esc(f.website)}" target="_blank" rel="noopener">🌐 Site</a>` : ""}${f.lat != null ? `<a href="harita.html#${f.id}">🗺️ Haritada gör</a>` : ""}</p>
    </details>
  </article>`;
}

function render() {
  const q = document.getElementById("q").value.toLowerCase(), m = document.getElementById("metal").value, og = document.getElementById("onlyGo").checked;
  const items = FACTORIES.filter(f => (!m || f.metal.includes(m)) && (!og || isGo(f)) && (!q || JSON.stringify(f).toLowerCase().includes(q)));
  const contacted = f => !!mailState(contactKey(f)).status;
  const sorter = (a, b) => (isGo(b) - isGo(a)) || (planDate(a.id) || "9").localeCompare(planDate(b.id) || "9") || a.tier.localeCompare(b.tier) || ((b.star ? 1 : 0) - (a.star ? 1 : 0));
  const yes = items.filter(contacted).sort(sorter), no = items.filter(f => !contacted(f)).sort(sorter);
  document.getElementById("list").innerHTML =
    (yes.length ? `<h2 class="group-h contacted">📞 İrtibata geçilenler <small>${yes.length}</small></h2><div class="grid">${yes.map(card).join("")}</div>` : "")
    + (no.length ? `<h2 class="group-h">İrtibata geçilmeyenler <small>${no.length}</small></h2><div class="grid">${no.map(card).join("")}</div>` : "");
  document.getElementById("count").textContent = `${items.length} üretici · 🚩 gidilecekler ve ziyaret günü olanlar üstte`;
}
["q", "metal", "onlyGo"].forEach(id => document.getElementById(id).addEventListener("input", render));

document.getElementById("csv").onclick = () => {
  const head = ["Firma", "Metal", "Bölge", "Adres", "Telefon", "E-posta", "Ürünler", "Gidilecek", "Ziyaret günü", "İletişim durumu", "Not", "Teklif USD/t", "LME %"];
  const rows = FACTORIES.map(f => { const ms = mailState(contactKey(f)), p = offerUsdT(f), ref = f.metal[0] === "aluminyum" ? R.al : R.cu;
    return [f.name, f.metal.map(x => METAL_LABEL[x]).join("/"), f.area, f.address, f.phones.join(" | "), f.emails.join(" | "), f.products.join(" | "), isGo(f) ? "Evet" : "", planDate(f.id), MAIL_STATUS[ms.status || ""], ms.note, p ? Math.round(p) : "", p ? (p / ref * 100).toFixed(1) : ""]; });
  const csv = "﻿" + [head, ...rows].map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(";")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); a.download = "misir-ureticiler.csv"; a.click();
};
window.onMailChange = render; window.onGoChange = render; window.onPlanChange = render;
document.getElementById("pwMsgs").innerHTML = producerWaMessages(null).map((m, i) => `<div class="wa-msg"><b>${m.tr}</b>
  <pre>${esc(m.text)}</pre><button class="big-btn ghost" data-copypw="${i}">📋 ${i + 1}. mesajı kopyala</button></div>`).join("");
try { render(); } catch (err) {
  document.getElementById("list").innerHTML = `<div class="warning danger">Liste yüklenemedi (eski önbellek olabilir). <button class="big-btn" onclick="(async()=>{try{for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();for(const k of await caches.keys())await caches.delete(k);}catch(e){}location.reload(true)})()">🔄 Önbelleği temizle ve yenile</button><br><small>${esc(err.message)}</small></div>`;
}
</script>
</body>
</html>
